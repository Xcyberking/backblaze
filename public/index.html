<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>B2 Manager</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 20px;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  h1 { margin-bottom: 16px; font-size: 24px; color: #38bdf8; }

  .login-box {
    max-width: 400px; margin: 100px auto; background: #1e293b;
    padding: 32px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  input, button {
    font-size: 15px; padding: 10px 14px; border-radius: 8px;
    border: 1px solid #334155; outline: none; font-family: inherit;
  }
  input {
    width: 100%; background: #0f172a; color: #e2e8f0; margin-bottom: 12px;
  }
  input:focus { border-color: #38bdf8; }
  button {
    background: #38bdf8; color: #0f172a; cursor: pointer;
    border: none; font-weight: 600; transition: .2s;
  }
  button:hover { background: #0ea5e9; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .login-box button { width: 100%; }

  .toolbar {
    display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;
    align-items: center;
  }
  .toolbar input[type="text"] {
    flex: 1; min-width: 200px; margin-bottom: 0;
  }
  .stat { color: #94a3b8; font-size: 14px; margin-bottom: 12px; }

  table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; }
  th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; }
  th { background: #334155; color: #cbd5e1; font-weight: 600; }
  tr:hover { background: #273449; }
  td.name { word-break: break-all; max-width: 400px; }
  .size { color: #22d3ee; font-weight: 600; white-space: nowrap; }
  .actions { display: flex; gap: 6px; }
  .btn-sm {
    padding: 6px 12px; font-size: 13px; border-radius: 6px;
  }
  .btn-dl { background: #22c55e; }
  .btn-dl:hover { background: #16a34a; }
  .btn-del { background: #ef4444; }
  .btn-del:hover { background: #dc2626; }

  .folder { color: #fbbf24; cursor: pointer; font-weight: bold;}
  .folder:hover { text-decoration: underline; }

  .breadcrumb { margin-bottom: 15px; font-size: 15px; color: #cbd5e1; }
  .breadcrumb span { color: #38bdf8; cursor: pointer; }
  .breadcrumb span:hover { text-decoration: underline; }

  .empty { text-align: center; padding: 40px; color: #64748b; }
  .error { color: #f87171; margin-top: 10px; font-size: 14px; }
  .loading { color: #38bdf8; padding: 20px; text-align: center; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="login" class="login-box">
  <h1 style="font-size:20px;margin-bottom:16px;">🔐 Login</h1>
  <input id="pw" type="password" placeholder="Admin password" />
  <button onclick="login()">Login</button>
  <div id="loginErr" class="error"></div>
</div>

<div id="app" class="container hidden">
  <h1>📦 Backblaze B2 Manager</h1>
  <div class="toolbar">
    <input id="search" type="text" placeholder="Search / prefix (e.g. folder/)" />
    <button onclick="loadFiles()">🔄 Refresh</button>
    <button onclick="logout()" style="background:#64748b;">Logout</button>
  </div>
  
  <div id="breadcrumb" class="breadcrumb"></div>
  <div class="stat" id="stats"></div>
  <div id="content"></div>
</div>

<script>
let token = localStorage.getItem('b2token') || '';
let currentPrefix = '';

function $(id) { return document.getElementById(id); }

// ---- Login ----
async function login() {
  const pw = $('pw').value;
  $('loginErr').textContent = '';
  try {
    const r = await fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Login failed');
    token = d.token;
    localStorage.setItem('b2token', token);
    showApp();
  } catch (e) {
    $('loginErr').textContent = e.message;
  }
}

function logout() {
  token = '';
  localStorage.removeItem('b2token');
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
}

function showApp() {
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  loadFiles(''); // Start from root
}

// ---- Fetch files ----
async function loadFiles(prefix = '') {
  currentPrefix = prefix;
  $('content').innerHTML = '<div class="loading">⏳ Loading files...</div>';
  renderBreadcrumb(prefix);

  try {
    const r = await fetch(`/api/files?prefix=${encodeURIComponent(prefix)}`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    if (r.status === 401) { logout(); return; }
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    renderFiles(d.files, d.folders, prefix);
  } catch (e) {
    $('content').innerHTML = `<div class="error">❌ ${e.message}</div>`;
  }
}

// ---- Breadcrumbs (Navigation Path) ----
function renderBreadcrumb(prefix) {
  if (!prefix) {
    $('breadcrumb').innerHTML = `📁 Root`;
    return;
  }
  
  const parts = prefix.split('/').filter(p => p);
  let html = `<span onclick="loadFiles('')">📁 Root</span>`;
  let currentPath = '';
  
  parts.forEach(part => {
    currentPath += part + '/';
    html += ` / <span onclick="loadFiles('${currentPath}')">${part}</span>`;
  });
  
  $('breadcrumb').innerHTML = html;
}

function fmtSize(bytes) {
  if (bytes === 0) return '0 B';
  const k = 1024, s = ['B','KB','MB','GB','TB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return `${(bytes / Math.pow(k, i)).toFixed(2)} ${s[i]}`;
}

function fmtDate(ts) {
  if (!ts) return '-';
  return new Date(ts).toLocaleString();
}

function renderFiles(files, folders, prefix) {
  let html = '';
  const totalSize = files.reduce((a, f) => a + f.size, 0);
  
  $('stats').textContent = `${files.length} files · ${folders.length} folders · Total size: ${fmtSize(totalSize)}`;

  html += '<table><thead><tr><th>Name</th><th>Size</th><th>Type</th><th>Uploaded</th><th>Actions</th></tr></thead><tbody>';

  // Render Folders
  folders.forEach((f) => {
    html += `<tr>
      <td class="name"><span class="folder" onclick="loadFiles('${f}')">📁 ${f}</span></td>
      <td>—</td><td>Folder</td><td>—</td><td>—</td>
    </tr>`;
  });

  if (files.length === 0 && folders.length === 0) {
    html += '<tr><td colspan="5" class="empty">No files found in this folder</td></tr>';
  }

  // Render Files
  files.forEach((f) => {
    // Hide the dummy file that represents the folder itself
    if (f.name === prefix && f.size === 0) return; 

    html += `<tr>
      <td class="name">📄 ${f.name.replace(prefix, '')}</td> <!-- Show only file name, not full path -->
      <td class="size">${fmtSize(f.size)}</td>
      <td>${(f.type || '').split('/')[1] || f.type || '-'}</td>
      <td>${fmtDate(f.uploaded)}</td>
      <td><div class="actions">
        <button class="btn-sm btn-dl" onclick='downloadFile(${JSON.stringify(f.name)})'>⬇</button>
        <button class="btn-sm btn-del" onclick='deleteFile(${JSON.stringify(f.id)}, ${JSON.stringify(f.name)})'>🗑</button>
      </div></td>
    </tr>`;
  });

  html += '</tbody></table>';
  $('content').innerHTML = html;
}

// ---- Download ----
async function downloadFile(fileName) {
  try {
    const r = await fetch(`/api/download?fileName=${encodeURIComponent(fileName)}`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    
    // Note: 4.6GB file might fail due to Vercel limits, better to open in new tab
    window.open(d.url, '_blank');
  } catch (e) {
    alert('Download error: ' + e.message);
  }
}

// ---- Delete ----
async function deleteFile(fileId, fileName) {
  if (!confirm(`Are you sure you want to delete:\n"${fileName}"?\n\nThis action cannot be undone.`)) return;

  try {
    const r = await fetch('/api/delete', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${token}`,
      },
      body: JSON.stringify({ fileId, fileName }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    loadFiles(currentPrefix); // Reload current folder
  } catch (e) {
    alert('Delete error: ' + e.message);
  }
}

// ---- Init ----
$('search').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') loadFiles($('search').value.trim());
});
$('pw').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') login();
});

if (token) showApp();
</script>
</body>
</html>
