<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>B2 File Manager</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 20px;
  }
  .container { max-width: 1000px; margin: 0 auto; }
  
  /* Login Box */
  .login-box { max-width: 400px; margin: 100px auto; background: #1e293b; padding: 32px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  input, button { font-size: 15px; padding: 10px 14px; border-radius: 8px; border: 1px solid #334155; outline: none; font-family: inherit; }
  input[type="password"], input[type="text"] { width: 100%; background: #0f172a; color: #e2e8f0; margin-bottom: 12px; }
  input:focus { border-color: #38bdf8; }
  button { background: #38bdf8; color: #0f172a; cursor: pointer; border: none; font-weight: 600; transition: .2s; }
  button:hover { background: #0ea5e9; }
  .login-box button { width: 100%; }

  /* Topbar */
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .topbar h1 { font-size: 22px; color: #38bdf8; }

  /* Storage Bar */
  .storage-card { background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #334155; }
  .storage-header { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; color: #cbd5e1; }
  .progress-bg { width: 100%; height: 12px; background: #0f172a; border-radius: 6px; overflow: hidden; }
  .progress-fill { height: 100%; background: #22c55e; transition: width 0.5s ease; }

  /* Toolbar */
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; align-items: center; }
  .toolbar input[type="text"] { flex: 1; min-width: 200px; margin-bottom: 0; }
  
  /* Breadcrumbs */
  .breadcrumb { background: #1e293b; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 15px; border: 1px solid #334155; word-break: break-all; }
  .breadcrumb span { color: #38bdf8; cursor: pointer; font-weight: 500; }
  .breadcrumb span:hover { text-decoration: underline; }
  .breadcrumb .slash { color: #64748b; margin: 0 5px; }

  /* File Table */
  table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; border: 1px solid #334155; }
  th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; }
  th { background: #1e293b; color: #94a3b8; font-weight: 600; border-bottom: 2px solid #334155; }
  tr:hover { background: #273449; }
  td.name { word-break: break-all; max-width: 300px; font-weight: 500;}
  .size { color: #22d3ee; font-weight: 600; white-space: nowrap; }
  .actions { display: flex; gap: 6px; justify-content: flex-end;}
  
  .btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .btn-dl { background: #22c55e; color: white; }
  .btn-dl:hover { background: #16a34a; }
  .btn-del { background: #ef4444; color: white; }
  .btn-del:hover { background: #dc2626; }

  .folder { color: #fbbf24; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 5px;}
  .folder:hover { text-decoration: underline; }
  .file { color: #e2e8f0; display: flex; align-items: center; gap: 5px;}

  .empty { text-align: center; padding: 40px; color: #64748b; }
  .error { color: #f87171; margin-top: 10px; font-size: 14px; }
  .loading { color: #38bdf8; padding: 20px; text-align: center; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="login" class="login-box">
  <h1 style="font-size:20px;margin-bottom:16px;text-align:center;">🔐 Login</h1>
  <input id="pw" type="password" placeholder="Admin password" />
  <button onclick="login()">Login</button>
  <div id="loginErr" class="error"></div>
</div>

<div id="app" class="container hidden">
  <div class="topbar">
    <h1>📦 B2 File Manager</h1>
    <button onclick="logout()" style="background:#64748b; padding:8px 16px;">Logout</button>
  </div>

  <div class="storage-card">
    <div class="storage-header">
      <span>Bucket Storage</span>
      <span id="storage-text">Loading...</span>
    </div>
    <div class="progress-bg">
      <div id="storage-bar" class="progress-fill" style="width: 0%;"></div>
    </div>
  </div>

  <div class="toolbar">
    <input id="search" type="text" placeholder="Search files in this folder..." />
    <button onclick="loadFiles(currentPrefix)">🔄 Refresh</button>
  </div>
  
  <div id="breadcrumb" class="breadcrumb"></div>
  <div id="content"></div>
</div>

<script>
let token = localStorage.getItem('b2token') || '';
let currentPrefix = '';

function $(id) { return document.getElementById(id); }

async function login() {
  const pw = $('pw').value;
  $('loginErr').textContent = '';
  try {
    const r = await fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Login failed');
    token = d.token;
    localStorage.setItem('b2token', token);
    showApp();
  } catch (e) {
    $('loginErr').textContent = e.message;
  }
}

function logout() {
  token = '';
  localStorage.removeItem('b2token');
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
  $('pw').value = '';
}

function showApp() {
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  loadFiles(''); 
}

function fmtSize(bytes) {
  if (!bytes || bytes === 0) return '0 B';
  const k = 1024, s = ['B','KB','MB','GB','TB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return `${(bytes / Math.pow(k, i)).toFixed(2)} ${s[i]}`;
}

function fmtDate(ts) {
  if (!ts) return '-';
  return new Date(ts).toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
}

async function loadFiles(prefix = '') {
  currentPrefix = prefix;
  $('content').innerHTML = '<div class="loading">⏳ Loading data...</div>';
  renderBreadcrumb(prefix);

  try {
    const r = await fetch(`/api/files?prefix=${encodeURIComponent(prefix)}`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    if (r.status === 401) { logout(); return; }
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    
    updateStorage(d.storage);
    renderFiles(d.files, d.folders, prefix);
  } catch (e) {
    $('content').innerHTML = `<div class="error">❌ ${e.message}</div>`;
  }
}

function updateStorage(storage) {
  if(!storage) return;
  const usedBytes = storage.total;
  const limitBytes = storage.limit;
  const percent = Math.min((usedBytes / limitBytes) * 100, 100);
  
  $('storage-text').textContent = `${fmtSize(usedBytes)} used of ${fmtSize(limitBytes)}`;
  $('storage-bar').style.width = `${percent.toFixed(1)}%`;
}

function renderBreadcrumb(prefix) {
  if (!prefix) {
    $('breadcrumb').innerHTML = `📍 <span onclick="loadFiles('')">Root</span>`;
    return;
  }
  
  const parts = prefix.split('/').filter(p => p);
  let html = `<span onclick="loadFiles('')">Root</span>`;
  let currentPath = '';
  
  parts.forEach((part, index) => {
    currentPath += part + '/';
    if (index === parts.length - 1) {
      html += `<span class="slash">/</span> <span style="color:#e2e8f0; cursor:default;">${part}</span>`;
    } else {
      html += `<span class="slash">/</span> <span onclick="loadFiles('${currentPath}')">${part}</span>`;
    }
  });
  
  $('breadcrumb').innerHTML = html;
}

function renderFiles(files, folders, prefix) {
  let html = '';
  const searchStr = $('search').value.toLowerCase();

  const filteredFiles = files.filter(f => f.displayName.toLowerCase().includes(searchStr));
  const filteredFolders = folders.filter(f => f.toLowerCase().includes(searchStr));

  html += '<table><thead><tr><th>Name</th><th>Size</th><th>Type</th><th>Uploaded</th><th style="text-align:right;">Actions</th></tr></thead><tbody>';

  // Render Folders
  filteredFolders.forEach((f) => {
    html += `<tr>
      <td class="name"><span class="folder" onclick="loadFiles('${prefix}${f}')">📁 ${f}</span></td>
      <td>—</td><td>Folder</td><td>—</td><td>—</td>
    </tr>`;
  });

  if (filteredFiles.length === 0 && filteredFolders.length === 0) {
    html += '<tr><td colspan="5" class="empty">No files or folders found</td></tr>';
  }

  // Render Files
  filteredFiles.forEach((f) => {
    const fileType = (f.type || '').split('/')[1] || f.type || 'FILE';
    
    html += `<tr>
      <td class="name"><span class="file">📄 ${f.displayName}</span></td>
      <td class="size">${fmtSize(f.size)}</td>
      <td style="text-transform:uppercase; font-size:12px;">${fileType}</td>
      <td style="font-size:13px; color:#94a3b8;">${fmtDate(f.uploaded)}</td>
      <td><div class="actions">
        <button class="btn-sm btn-dl" onclick='downloadFile(${JSON.stringify(f.name)})'>⬇</button>
        <button class="btn-sm btn-del" onclick='deleteFile(${JSON.stringify(f.id)}, ${JSON.stringify(f.name)})'>🗑</button>
      </div></td>
    </tr>`;
  });

  html += '</tbody></table>';
  $('content').innerHTML = html;
}

async function downloadFile(fileName) {
  try {
    const r = await fetch(`/api/download?fileName=${encodeURIComponent(fileName)}`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    window.open(d.url, '_blank');
  } catch (e) {
    alert('Download error: ' + e.message);
  }
}

async function deleteFile(fileId, fileName) {
  if (!confirm(`Delete "${fileName}" permanently?`)) return;

  try {
    const r = await fetch('/api/delete', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${token}`,
      },
      body: JSON.stringify({ fileId, fileName }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    loadFiles(currentPrefix); 
  } catch (e) {
    alert('Delete error: ' + e.message);
  }
}

$('search').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') loadFiles(currentPrefix);
});

$('pw').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') login();
});

if (token) showApp();
</script>
</body>
</html>
